# Revisión de seguridad automática (v1.9.12).
#
# Tres revisiones, en modo SOLO INFORME (continue-on-error): un hallazgo marca
# el paso en rojo pero no frena nada. Para hacerlas estrictas, borrar la línea
# `continue-on-error: true` del paso correspondiente (ver ENTREGA_v1.9.12.md).
#
# - pip-audit: vulnerabilidades conocidas en las dependencias (requirements.txt).
# - Trivy: el repositorio (dependencias, secretos y configuración) y la imagen
#   construida desde el Dockerfile. La imagen NO se publica.
# - gitleaks: secretos en TODO el historial (el repositorio es público).
#
# No usa secretos del repositorio ni publica nada. Las acciones van fijadas
# por SHA y los binarios de Trivy y gitleaks por versión y sha256 (en marzo de
# 2026 se reescribieron casi todas las etiquetas de aquasecurity/trivy-action
# con código malicioso: por eso no se usa esa acción).

name: Seguridad

on:
  push:
    branches: [main, fixes_generales]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"     # lunes 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  dependencias:
    name: pip-audit (dependencias)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==${PIP_AUDIT_VERSION}"
      - name: pip-audit -r requirements.txt
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc on

  trivy:
    name: Trivy (repositorio e imagen)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Trivy (versión fija, sha256 verificado)
        run: |
          set -euo pipefail
          archivo="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archivo}"
          echo "${TRIVY_SHA256}  ${archivo}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archivo" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Trivy fs (repositorio)
        continue-on-error: true
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - name: Construir la imagen (local, no se publica)
        run: docker build -t hub-telematico:revision .
      - name: Trivy image (imagen construida)
        continue-on-error: true
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress hub-telematico:revision

  secretos:
    name: gitleaks (historial completo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks (versión fija, sha256 verificado)
        run: |
          set -euo pipefail
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${archivo}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archivo" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gitleaks git (todo el historial)
        continue-on-error: true
        # --redact: el informe no repite el secreto encontrado (el log de
        # Actions de un repositorio público es público).
        run: gitleaks git --redact --verbose --exit-code 1 .
