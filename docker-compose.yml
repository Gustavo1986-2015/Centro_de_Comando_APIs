# === HUB TELEMÁTICO ASSISTCARGO — DESPLIEGUE EN PRODUCCIÓN ===
#
# La imagen se publica en Docker Hub y el servidor solo la descarga.
#
#   Desarrollo (máquina de Gustavo) — construir y publicar:
#     docker compose build
#     docker tag gustavogomez08/hubtelematicoassistcargo:latest \
#                gustavogomez08/hubtelematicoassistcargo:vX.Y.Z
#     docker compose push
#     docker push gustavogomez08/hubtelematicoassistcargo:vX.Y.Z
#
#     Después, actualizar el tag de `image:` más abajo y commitear el cambio.
#
#   Producción (servidor) — descargar y levantar:
#     git pull origin main        # trae este archivo con el tag nuevo
#     docker compose pull
#     docker compose up -d
#
#   Rollback: cambiar el tag de `image:` a la versión anterior y repetir
#   `docker compose up -d`. Por eso se fija una versión explícita en lugar de
#   usar `latest`: con `latest` no hay forma de saber qué está corriendo ni a
#   qué volver.
#
#   Ver logs:      docker compose logs -f --tail=50
#   Reiniciar:     docker compose restart
#
# IMPORTANTE: el archivo .env debe existir en el servidor con las credenciales.
# Nunca se sube a Git ni se incluye en la imagen (está en .dockerignore).

services:
  centro-comando:
    # Imagen publicada en Docker Hub, con versión fija.
    #
    # Se evita `latest` a propósito: hace el despliegue ambiguo (no se sabe qué
    # build está corriendo) y complica el rollback. Con el tag explícito, este
    # archivo documenta exactamente qué versión está en producción.
    #
    # Al publicar una versión nueva hay que actualizar este tag y commitearlo.
    image: gustavogomez08/hubtelematicoassistcargo:v1.7.2
    container_name: centro-comando-app

    # Sección build: solo se usa al ejecutar `docker compose build` en la máquina
    # de desarrollo. En el servidor nunca se ejecuta porque se hace `pull`.
    build:
      context: .
      dockerfile: Dockerfile

    # Si el servidor se reinicia, el contenedor arranca solo.
    restart: unless-stopped

    # Credenciales y configuración. Este archivo vive solo en el servidor.
    env_file:
      - .env

    environment:
      - APP_ENV=production

    # El reverse proxy (nginx/HTTPS) redirige el tráfico externo hacia este puerto.
    ports:
      - "8000:8000"

    # VOLÚMENES — solo datos persistentes, NUNCA el código fuente.
    #
    # Antes existía un volumen `- .:/app` que montaba el directorio del host
    # sobre /app. Eso anulaba por completo el código bakeado en la imagen: el
    # contenedor ejecutaba los archivos del servidor, no los de la imagen
    # publicada. Con ese montaje, actualizar la imagen en Docker Hub no tenía
    # ningún efecto sobre lo que realmente corría.
    #
    # Al quitarlo, el código proviene exclusivamente de la imagen y el deploy
    # se vuelve reproducible: la misma imagen se comporta igual en cualquier
    # servidor. Los tres volúmenes de abajo persisten únicamente los datos que
    # deben sobrevivir a un redeploy.
    volumes:
      - ./db:/app/db           # Bases SQLite por proveedor (sharding)
      - ./logs:/app/logs       # Logs de aplicación (app.jsonl)
      - ./audit:/app/audit     # Auditoría cruda JSONL de payloads entrantes

    # Healthcheck: Docker marca el contenedor como unhealthy si la app no responde.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Evita que los logs de Docker llenen el disco del servidor.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
